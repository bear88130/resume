<header class="hero">
  <div class="container">
    <div class="hero-grid">
      <div class="hero-intro">
        <p class="hero-brand">
          <img src="img/icon.png" alt="" aria-hidden="true">
          <span>RESUME</span>
        </p>
        <h1 class="hero-name">莊博雄</h1>
        <p class="hero-role">前端工程師 · Angular × 機器學習</p>
      </div>
      <div class="hero-meta">
        <ul class="tag-list" aria-label="主要技能">
          <li>Angular</li>
          <li>TypeScript</li>
          <li>ASP.NET</li>
          <li>Python</li>
          <li>機器學習</li>
        </ul>
        <nav class="hero-links" aria-label="外部連結">
          <a class="btn-primary-modern" target="_blank" rel="noopener" href="https://github.com/bear88130">
            <i class="fab fa-github" aria-hidden="true"></i> GitHub
          </a>
          <a class="btn-ghost" target="_blank" rel="noopener" href="https://ithelp.ithome.com.tw/users/20107754">
            <i class="fas fa-pencil-alt" aria-hidden="true"></i> iT 邦幫忙文章
          </a>
        </nav>
      </div>
      <div class="hero-profile">
        <div class="hero-photo">
          <img src="img/id-photo.png" alt="莊博雄的大頭照">
        </div>
        <section class="hero-info" aria-labelledby="info-title">
          <h2 class="section-title" id="info-title">
            <i class="fas fa-id-card" aria-hidden="true"></i> Information
          </h2>
          <div class="info-grid">
            <div class="tile tile-name">
              <span class="tile-label"><i class="fas fa-user" aria-hidden="true"></i> 姓名</span>
              <span class="tile-value">莊博雄</span>
            </div>
            <div class="tile">
              <span class="tile-label"><i class="fas fa-birthday-cake" aria-hidden="true"></i> 生日</span>
              <span class="tile-value">1993 / 11 / 09 (30歲)</span>
            </div>
            <div class="tile">
              <span class="tile-label"><i class="fas fa-venus-mars" aria-hidden="true"></i> 性別</span>
              <span class="tile-value">男</span>
            </div>
            <div class="tile tile-service">
              <span class="tile-label"><i class="fas fa-flag" aria-hidden="true"></i> 服役狀況</span>
              <span class="tile-value">嘉義縣政府教育替代役 - 役畢</span>
            </div>
            <div class="tile tile-wide">
              <span class="tile-label"><i class="fas fa-graduation-cap" aria-hidden="true"></i> 最高學歷</span>
              <span class="tile-value">東華大學 - 資訊工程學研究所</span>
              <span class="tile-meta">2022 – 2024</span>
              <!-- 嶺東科技大學 - 資訊網路系 -->
            </div>
            <div class="tile tile-wide tile-accent">
              <span class="tile-label"><i class="fas fa-briefcase" aria-hidden="true"></i> 工作經驗</span>
              <span class="tile-value">華岡興業基金會 - 研發工程師</span>
              <span class="tile-meta">2018 – 2021</span>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
</header>

<div class="mode-bar">
  <div class="container">
    <div class="segmented" role="group" aria-label="履歷版本">
      <button type="button" [class.active]="isSimplify" [attr.aria-pressed]="isSimplify" (click)="setMode(true)">
        <i class="fas fa-bolt" aria-hidden="true"></i> 精簡型
      </button>
      <button type="button" [class.active]="!isSimplify" [attr.aria-pressed]="!isSimplify" (click)="setMode(false)">
        <i class="fas fa-th-large" aria-hidden="true"></i> 綜合型
      </button>
    </div>
  </div>
</div>

<main class="container">
  <app-simplify [isSimplify]="isSimplify || false" (lightboxEmitter)="emitLightBox($event)"></app-simplify>

  <app-comprehensive [isSimplify]="isSimplify || false"></app-comprehensive>
</main>

<!-- 圖片 Modal Start -->
<div class="modal fade" id="lightBoxModal" tabindex="-1" role="dialog" aria-labelledby="lightBoxModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-80" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="lightBoxModalLabel">{{lightBoxTitle}}</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="關閉">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <img [src]="lightBoxImg" [alt]="lightBoxTitle">
      </div>
    </div>
  </div>
</div>
<!-- 圖片 Modal End -->

<footer class="site-footer">
  <div class="container">
    <p>© 莊博雄 · 以 Angular 製作</p>
    <a target="_blank" rel="noopener" href="https://github.com/bear88130/resume">
      <i class="fab fa-github" aria-hidden="true"></i> 原始碼
    </a>
  </div>
</footer>
